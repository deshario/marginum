[project]
name = "marginum-signal-analyzer"
version = "0.1.0"
description = "GUI for detecting peaks in large signal CSV files"
readme = "README.md"
authors = [
    { name = "Deshar Sunil", email = "deshario9@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.gui-scripts]
marginum-signal-analyzer = "marginum_signal_analyzer.gui:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
